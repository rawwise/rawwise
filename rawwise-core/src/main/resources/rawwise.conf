rawwise {
  cluster {
    id = "default"
  }

  zookeeper {
    connect-string = "127.0.0.1:2181"
    namespace = "rawwise"
  }

  metastore {
    type = "inmemory"
    grpc-port = 9001
    base-path = "/tmp/rawwise/metastore"
  }

  shard {
    count = 1
  }

  storage {
    mmap-path = "/tmp/rawwise/mmap"
    mmap-size = 1073741824
    durability-level = "PROCESS"

    lmdb {
      map-size-mb = 1024
      max-dbs = 16
    }

    wal {
      enabled = true
      buffer-size = 65536
      sync-interval-ms = 1000
      max-size-bytes = 268435456
      hdfs-path = "/rawwise/wal"
      compression-codec = "LZ4"
      file-format = "PARQUET"
      append-timeout-ms = 5000
    }
  }

  ingestion {
    sink {
      type = "LMDB"
      parquet {
        hdfs-base-path = "/rawwise"
        max-file-size-mb = 256
        compression-codec = "ZSTD"
        row-group-size = 134217728
        dictionary-enabled = true
        page-size-bytes = 1048576
        write-buffer-size = 67108864
        max-pending-files = 32
        flush-interval-ms = 30000
        recent-snapshot-scan-count = 10
      }
    }

    max {
      pending-instances = 128
      pending-batch-size = 10000
      pending-batch-bytes = 104857600
    }

    batch {
      initial-capacity = 128
    }
  }

  compaction {
    trigger-interval-ms = 60000
    max-concurrent = 3
    strategy = "SIZE_TIERED"
    small-file-threshold-mb = 128
    target-file-size-mb = 256
    max-file-group-size = 10
    min-files-to-compact = 3
    delete-tombstone-ratio = 0.3
    compaction-ratio = 1.6
    parallelism = 2
    io-threads = 4
    memory-budget-mb = 512
    temp-dir = "/tmp/rawwise/compaction"
    max-retries = 3
    retry-delay-ms = 5000
    timeout-minutes = 30
    checkpoint-interval-ms = 30000
    metrics-enabled = true
    metrics-interval-ms = 10000
  }

  backend {
    spark {
      master = "local[*]"
      driver-memory = "4g"
    }

    tls {
      enabled = false
      cert-path = ""
      key-path = ""
    }

    auth {
      enabled = true
    }

    job {
      cancelling-timeout-ms = 30000
    }

    backpressure {
      interactive.permits = 10
      interactive.timeout-ms = 5000
      batch.permits = 5
      batch.timeout-ms = 10000
      training.permits = 20
      training.timeout-ms = 30000
      training.degrade-threshold = 0.85
      inference.permits = 50
      inference.timeout-ms = 1000
    }
  }

  frontend {
    grpc-backend-port = 9090
  }
}
