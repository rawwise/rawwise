name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check formatting
        run: mvn -B -ntp spotless:check

      - name: Build
        run: mvn -B -ntp -DskipTests package

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rawwise-jars
          path: |
            rawwise-core/target/*.jar
            rawwise-benchmark/target/*.jar
          if-no-files-found: ignore
          retention-days: 7
