name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        if: |
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Requires a classic PAT with `repo` scope, stored as repository secret
          # PERSONAL_ACCESS_TOKEN, because the bot writes to the signature branch.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/rawwise/rawwise/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'rawwise,dependabot[bot],renovate[bot]'
          # Signature covers all past and future contributions of the signer.
          signed-commit-message: 'chore: record CLA signature for $contributorName'
          create-file-commit-message: 'chore: create CLA signature store'
          custom-notsigned-prcomment: |
            Thank you for your contribution. Before this pull request can be
            reviewed or merged, you must sign the [CLA](https://github.com/rawwise/rawwise/blob/main/CLA.md).

            Please reply with the following comment:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
